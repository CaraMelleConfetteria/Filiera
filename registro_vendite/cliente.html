<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>CaraMelle — pagamento</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #fafafa;
  color: #1a1a1a;
  user-select: none;
}

/* ═══ LO SFONDO FISSO ═══
   L'invito al gruppo «Golosone!» sta a schermo tutto il giorno: e' quello
   che il cliente guarda mentre aspetta, e vale piu' di un marchio fermo.
   Il file si chiama sempre cosi' e sta accanto a questa pagina: per
   cambiarlo si sostituisce l'immagine su GitHub, senza toccare il codice.

   Si usa background-image e non un <img>: cosi' si puo' dire "stai dentro
   lo schermo senza deformarti" anche sui Safari vecchi, che object-fit non
   lo conoscono. Se il file mancasse resta il fondo chiaro e non si rompe
   niente. */
body {
  background-image: url('attesa.gif');
  background-repeat: no-repeat;
  background-position: center center;
  background-size: contain;
}

/* Le tre schermate stanno tutte qui sopra, una sola visibile per volta.
   Non si ricostruisce niente al cambio di stato: si accende e si spegne.
   Un monitor che resta acceso dodici ore non deve avere niente che si
   accumula. */
.schermata {
  position: absolute;
  /* Non "inset: 0": Safari lo capisce solo dalla 14.1, e su un iPad piu'
     vecchio le schermate resterebbero senza dimensioni — pagina accartocciata
     e nessun QR. Le quattro proprieta' separate le capiscono tutti. */
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4vmin;
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s ease;
}
.schermata.visibile { opacity: 1; visibility: visible; }

/* ─── in attesa del prossimo cliente ───
   Non c'e' niente: si vede l'invito al gruppo, che e' lo sfondo. */
#attesa { background: transparent; }

/* ─── il QR da inquadrare ───
   Costruita qui, non piu' un'immagine con un buco dentro.

   La differenza non e' estetica. Finche' era una locandina con un quadrato
   bianco disegnato, il QR era grande quanto quel quadrato: il 17% della
   larghezza dell'immagine, che su questo iPad faceva 24 millimetri. Il
   cliente doveva avvicinare il telefono a un palmo.
   Costruita a pezzi, il QR e' grande quanto decidiamo: 42vmin, cioe' piu'
   di sei centimetri, e lo stesso in verticale e in orizzontale — vmin
   guarda il lato corto dello schermo, che nelle due posizioni e' lo stesso.

   I puntini restano NERI su BIANCO. Un QR si legge per differenza di luce,
   e i lettori si aspettano scuro su chiaro: bianco su rosso e' un negativo,
   che molti telefoni non agganciano affatto. Il rosso ce l'ha attorno. */
/* Le misure sono in vmin — il lato corto dello schermo — perche' cosi'
   valgono uguali con l'iPad in piedi e coricato: il lato corto e' lo
   stesso, e il QR viene grande uguale nelle due posizioni.
   Sommate stanno dentro anche da coricato, dove lo spazio in altezza e'
   tutto quello che c'e': 4 di margine + 18 di marchio + 4 + 3 + 42 di QR
   + 3 + 3 + 6 di scritta + 4 = 87vmin su 133 di schermo. Se si tocca una
   di queste misure, rifare quella somma — da coricato il margine e' poco. */
#qr {
  background: #EF5646;
  padding: 4vmin;
}

.marchio-caramelle {
  width: 48vmin;
  max-width: 86%;
  height: auto;
}

.riquadro {
  margin: 4vmin 0 3vmin;
  padding: 3vmin;
  background: #fff;
  border-radius: 4vmin;
  line-height: 0;
}

#tela {
  display: block;
  width: 42vmin;
  height: 42vmin;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: pixelated;
}

.marchio-satispay {
  width: 34vmin;
  height: auto;
}

/* ─── pagato ─── */
#pagato { background: #1e8e3e; color: #fff; }
.spunta {
  width: 22vmin;
  height: 22vmin;
  border-radius: 50%;
  border: 1.2vmin solid rgba(255,255,255,.9);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: cresce .45s cubic-bezier(.2,.9,.3,1.4);
}
.spunta svg { width: 11vmin; height: 11vmin; }
@keyframes cresce { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.esito { margin-top: 4vmin; font-size: 6vmin; font-weight: 700; }
.esito-importo { margin-top: 1vmin; font-size: 3.4vmin; opacity: .85; }

/* ─── guasti ─── */
#guasto { background: #1a1a1a; color: #fff; }
.guasto-titolo { font-size: 4vmin; font-weight: 600; }
.guasto-nota { margin-top: 2vmin; font-size: 2.4vmin; color: #999; max-width: 70vmin; text-align: center; line-height: 1.6; }

/* Pallino di collegamento. Nasce ACCESO e si spegne al primo scambio
   riuscito col motore, non il contrario.

   Il motivo l'abbiamo imparato a spese nostre: la schermata di partenza è
   il marchio, la stessa che si vede quando tutto va bene e non c'è nessun
   pagamento in corso. Una pagina che non riusciva nemmeno a telefonare
   restava lì, identica, e sembrava a posto — mentre al banco il QR era
   stato creato da venti minuti. Un guasto che assomiglia al buon
   funzionamento è il peggiore di tutti.

   Ora, finché quel pallino è rosso, quella pagina non ha ancora parlato
   con nessuno. Piccolo e in un angolo: deve dirlo a chi sta dietro il
   banco, non spaventare il cliente davanti. */
#collegamento {
  position: absolute;
  top: 1.6vmin;
  right: 1.6vmin;
  width: 1.2vmin;
  height: 1.2vmin;
  border-radius: 50%;
  background: #d93025;
  opacity: 0;
  transition: opacity .4s ease;
}
#collegamento.acceso { opacity: 1; }
</style>
</head>
<body>

<div id="collegamento" class="acceso"></div>

<div class="schermata visibile" id="attesa"></div>

<div class="schermata" id="qr">
  <img class="marchio-caramelle" src="logo-caramelle.png" alt="CaraMelle">
  <div class="riquadro"><canvas id="tela"></canvas></div>
  <img class="marchio-satispay" src="logo-satispay.png" alt="Satispay">
</div>

<div class="schermata" id="pagato">
  <div class="spunta">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
         stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
  </div>
  <div class="esito">Pagamento ricevuto</div>
  <div class="esito-importo" id="pagatoImporto"></div>
</div>

<div class="schermata" id="guasto">
  <div class="guasto-titolo" id="guastoTitolo">Schermo non configurato</div>
  <div class="guasto-nota" id="guastoNota"></div>
</div>

<script>
/* ═════ CODICE QR ════════════════════════════════════════════════════
   Disegna un QR a partire da una stringa. Non è una libreria presa da
   internet: sta qui dentro perché questa pagina deve funzionare anche
   quando la rete della fiera va e viene, e un file caricato da un altro
   sito sarebbe una cosa in più che può non arrivare proprio nel momento
   in cui il cliente ha il telefono in mano.

   Fa solo quello che serve: modalità byte, correzione errori M (recupera
   fino a circa il 15% del disegno rovinato), versioni da 1 a 10 — fino a
   216 caratteri, e il codice di Satispay ne conta una cinquantina.

   Verificato riga per riga contro la libreria "qrcode" di npm su tutte le
   lunghezze da 1 a 216 caratteri: stessa versione, stessa maschera,
   stessa identica matrice di puntini.
   ═══════════════════════════════════════════════════════════════════ */
var QR = (function () {
  'use strict';

  // Byte di correzione per blocco, e numero di blocchi, al livello M.
  // Sono tabelle dello standard: non si calcolano, si copiano.
  var CORREZIONE = [10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  var BLOCCHI    = [ 1,  1,  1,  2,  2,  4,  4,  4,  5,  5];

  /* ─── aritmetica del campo di Galois ────────────────────────────────
     I byte di correzione si calcolano in un'aritmetica dove somma e
     sottrazione sono la stessa cosa (lo XOR) e la moltiplicazione non
     esce mai da 0..255. È quella che permette di ricostruire i pezzi
     mancanti quando il QR è sporco o piegato.                          */
  function moltiplica(a, b) {
    var r = 0;
    for (var i = 7; i >= 0; i--) {
      r = (r << 1) ^ ((r >>> 7) * 0x11d);
      r ^= ((b >>> i) & 1) * a;
    }
    return r & 0xff;
  }

  function generatore(grado) {
    var g = [];
    for (var i = 0; i < grado - 1; i++) g.push(0);
    g.push(1);                                  // il polinomio (x - 1)
    var radice = 1;
    for (var i = 0; i < grado; i++) {
      // si moltiplica il polinomio corrente per (x - radice)
      for (var j = 0; j < g.length; j++) {
        g[j] = moltiplica(g[j], radice);
        if (j + 1 < g.length) g[j] ^= g[j + 1];
      }
      radice = moltiplica(radice, 0x02);
    }
    return g;
  }

  function correzione(dati, grado) {
    var g = generatore(grado);
    var resto = [];
    for (var i = 0; i < grado; i++) resto.push(0);
    for (var i = 0; i < dati.length; i++) {
      var fattore = dati[i] ^ resto.shift();
      resto.push(0);
      for (var j = 0; j < grado; j++) resto[j] ^= moltiplica(g[j], fattore);
    }
    return resto;
  }

  /* ─── quanto ci sta in ogni versione ────────────────────────────── */

  // Puntini utili di una versione, tolti i disegni fissi.
  function moduliGrezzi(ver) {
    var r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      var n = Math.floor(ver / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (ver >= 7) r -= 36;
    }
    return r;
  }

  function byteDati(ver) {
    return Math.floor(moduliGrezzi(ver) / 8) - CORREZIONE[ver - 1] * BLOCCHI[ver - 1];
  }

  function posizioniAllineamento(ver) {
    if (ver === 1) return [];
    var n = Math.floor(ver / 7) + 2;
    var passo = Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
    var p = [6];
    for (var pos = ver * 4 + 17 - 7; p.length < n; pos -= passo) p.splice(1, 0, pos);
    return p;
  }

  /* ─── costruzione ───────────────────────────────────────────────── */

  function bitDaTesto(testo, ver) {
    // La stringa va in UTF-8: il codice Satispay è tutto ASCII, ma se un
    // giorno ci finisse un accento uscirebbe comunque giusto.
    var byte = [];
    for (var i = 0; i < testo.length; i++) {
      var c = testo.charCodeAt(i);
      if (c < 0x80) byte.push(c);
      else if (c < 0x800) byte.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
      else byte.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
    }

    var bit = [];
    function aggiungi(valore, quanti) {
      for (var k = quanti - 1; k >= 0; k--) bit.push((valore >>> k) & 1);
    }

    aggiungi(4, 4);                                   // modalità byte
    aggiungi(byte.length, ver <= 9 ? 8 : 16);         // quanti byte
    for (var i = 0; i < byte.length; i++) aggiungi(byte[i], 8);

    var capienza = byteDati(ver) * 8;
    if (bit.length > capienza) return null;

    // Chiusura, allineamento al byte, e riempimento con i due byte di
    // servizio previsti dallo standard.
    for (var i = 0; i < 4 && bit.length < capienza; i++) bit.push(0);
    while (bit.length % 8 !== 0) bit.push(0);
    var tappi = [0xec, 0x11], t = 0;
    while (bit.length < capienza) { aggiungi(tappi[t], 8); t ^= 1; }

    var out = [];
    for (var i = 0; i < bit.length; i += 8) {
      var v = 0;
      for (var j = 0; j < 8; j++) v = (v << 1) | bit[i + j];
      out.push(v);
    }
    return out;
  }

  // I blocchi si intrecciano: un byte di questo, uno di quello. Così una
  // macchia sul foglio non cancella un blocco intero ma un pezzetto di
  // ciascuno, e ognuno si ripara da solo.
  function intreccia(dati, ver) {
    var nBlocchi = BLOCCHI[ver - 1];
    var nCorrezione = CORREZIONE[ver - 1];
    var totale = Math.floor(moduliGrezzi(ver) / 8);
    var corti = nBlocchi - (totale % nBlocchi);
    var lunghezzaCorta = Math.floor(totale / nBlocchi) - nCorrezione;

    var blocchi = [], i = 0;
    for (var b = 0; b < nBlocchi; b++) {
      var quanti = lunghezzaCorta + (b < corti ? 0 : 1);
      var parte = dati.slice(i, i + quanti);
      i += quanti;
      blocchi.push({ dati: parte, ecc: correzione(parte, nCorrezione) });
    }

    var fuori = [];
    for (var j = 0; j < lunghezzaCorta + 1; j++) {
      for (var b = 0; b < nBlocchi; b++) {
        if (j < blocchi[b].dati.length) fuori.push(blocchi[b].dati[j]);
      }
    }
    for (var j = 0; j < nCorrezione; j++) {
      for (var b = 0; b < nBlocchi; b++) fuori.push(blocchi[b].ecc[j]);
    }
    return fuori;
  }

  function disegna(byte, ver, maschera) {
    var taglia = ver * 4 + 17;
    var m = [], fisso = [];
    for (var y = 0; y < taglia; y++) {
      // Riempite a mano invece che con .fill(): su un Safari molto vecchio
      // quel metodo puo' non esserci, e qui non si vuole dipendere da niente.
      var rigaM = [], rigaF = [];
      for (var x0 = 0; x0 < taglia; x0++) { rigaM.push(false); rigaF.push(false); }
      m.push(rigaM);
      fisso.push(rigaF);
    }

    function metti(x, y, scuro) {
      if (x < 0 || y < 0 || x >= taglia || y >= taglia) return;
      m[y][x] = scuro;
      fisso[y][x] = true;
    }

    // I tre quadrati agli angoli: servono al telefono per trovare il
    // codice e capire come è girato.
    function mirino(cx, cy) {
      for (var dy = -4; dy <= 4; dy++) {
        for (var dx = -4; dx <= 4; dx++) {
          var d = Math.max(Math.abs(dx), Math.abs(dy));
          metti(cx + dx, cy + dy, d !== 2 && d !== 4);
        }
      }
    }
    mirino(3, 3);
    mirino(taglia - 4, 3);
    mirino(3, taglia - 4);

    // Le righe di riferimento fra un mirino e l'altro.
    for (var i = 8; i < taglia - 8; i++) {
      metti(6, i, i % 2 === 0);
      metti(i, 6, i % 2 === 0);
    }

    // I quadratini di allineamento, che raddrizzano il codice quando la
    // foto è storta o la carta è curva.
    var pos = posizioniAllineamento(ver);
    for (var a = 0; a < pos.length; a++) {
      for (var b = 0; b < pos.length; b++) {
        var saltaAngolo = (a === 0 && b === 0) ||
                          (a === 0 && b === pos.length - 1) ||
                          (a === pos.length - 1 && b === 0);
        if (saltaAngolo) continue;
        for (var dy = -2; dy <= 2; dy++) {
          for (var dx = -2; dx <= 2; dx++) {
            metti(pos[b] + dx, pos[a] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
          }
        }
      }
    }

    // Riserva lo spazio delle informazioni di formato e di versione: qui
    // i dati non ci vanno, si scrivono dopo.
    // La riga e la colonna 6 sono le righe di riferimento e restano dove
    // sono: le informazioni di formato le scavalcano.
    for (var i = 0; i <= 8; i++) {
      if (i === 6) continue;
      metti(i, 8, false);
      metti(8, i, false);
    }
    for (var i = 0; i < 8; i++) { metti(taglia - 1 - i, 8, false); metti(8, taglia - 1 - i, false); }
    metti(8, taglia - 8, true);                    // il puntino sempre scuro

    if (ver >= 7) {
      for (var i = 0; i < 18; i++) {
        metti(Math.floor(i / 3), taglia - 11 + (i % 3), false);
        metti(taglia - 11 + (i % 3), Math.floor(i / 3), false);
      }
    }

    // I dati, a zigzag da destra verso sinistra.
    var bitIdx = 0;
    for (var destra = taglia - 1; destra >= 1; destra -= 2) {
      if (destra === 6) destra = 5;               // la colonna di riferimento si salta
      for (var v = 0; v < taglia; v++) {
        for (var j = 0; j < 2; j++) {
          var x = destra - j;
          var suGiu = ((destra + 1) & 2) === 0;
          var y = suGiu ? taglia - 1 - v : v;
          if (!fisso[y][x] && bitIdx < byte.length * 8) {
            m[y][x] = ((byte[bitIdx >>> 3] >>> (7 - (bitIdx & 7))) & 1) === 1;
            bitIdx++;
          }
        }
      }
    }

    // La maschera: si ribalta il colore secondo una regola geometrica, per
    // evitare zone tutte bianche o tutte nere che il telefono fatica a
    // leggere. Non è cifratura, e il telefono la annulla da solo: la
    // regola usata gliela diciamo nelle informazioni di formato.
    for (var y = 0; y < taglia; y++) {
      for (var x = 0; x < taglia; x++) {
        if (fisso[y][x]) continue;
        var inverti;
        switch (maschera) {
          case 0: inverti = (x + y) % 2 === 0; break;
          case 1: inverti = y % 2 === 0; break;
          case 2: inverti = x % 3 === 0; break;
          case 3: inverti = (x + y) % 3 === 0; break;
          case 4: inverti = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
          case 5: inverti = (x * y) % 2 + (x * y) % 3 === 0; break;
          case 6: inverti = ((x * y) % 2 + (x * y) % 3) % 2 === 0; break;
          default: inverti = ((x + y) % 2 + (x * y) % 3) % 2 === 0; break;
        }
        if (inverti) m[y][x] = !m[y][x];
      }
    }

    // Informazioni di formato: livello di correzione e maschera, protette
    // da un codice a correzione d'errore loro (vengono scritte due volte,
    // perché se si perdono non si legge più niente).
    var formato = (0 << 3) | maschera;             // 00 = livello M
    var resto = formato;
    for (var i = 0; i < 10; i++) resto = (resto << 1) ^ ((resto >>> 9) * 0x537);
    var bitFormato = ((formato << 10) | resto) ^ 0x5412;

    for (var i = 0; i <= 5; i++) metti(8, i, ((bitFormato >>> i) & 1) === 1);
    metti(8, 7, ((bitFormato >>> 6) & 1) === 1);
    metti(8, 8, ((bitFormato >>> 7) & 1) === 1);
    metti(7, 8, ((bitFormato >>> 8) & 1) === 1);
    for (var i = 9; i < 15; i++) metti(14 - i, 8, ((bitFormato >>> i) & 1) === 1);

    for (var i = 0; i < 8; i++) metti(taglia - 1 - i, 8, ((bitFormato >>> i) & 1) === 1);
    for (var i = 8; i < 15; i++) metti(8, taglia - 15 + i, ((bitFormato >>> i) & 1) === 1);
    metti(8, taglia - 8, true);

    if (ver >= 7) {
      var r = ver;
      for (var i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1f25);
      var bitVersione = (ver << 12) | r;
      for (var i = 0; i < 18; i++) {
        var acceso = ((bitVersione >>> i) & 1) === 1;
        metti(Math.floor(i / 3), taglia - 11 + (i % 3), acceso);
        metti(taglia - 11 + (i % 3), Math.floor(i / 3), acceso);
      }
    }

    return m;
  }

  /* ─── scelta della maschera ─────────────────────────────────────────
     Si disegnano tutte e otto e si tiene quella che il telefono legge
     meglio, secondo il punteggio previsto dallo standard: penalizza le
     file lunghe di uno stesso colore, i quadrati pieni, i disegni che
     assomigliano ai mirini e lo sbilanciamento fra chiaro e scuro.     */
  function punteggio(m) {
    var taglia = m.length, p = 0, scuri = 0;

    for (var y = 0; y < taglia; y++) {
      for (var x = 0; x < taglia; x++) if (m[y][x]) scuri++;
    }

    function fila(leggi) {
      for (var a = 0; a < taglia; a++) {
        var corsa = 1, ultimo = leggi(a, 0);
        var storia = [];
        for (var b = 1; b < taglia; b++) {
          var v = leggi(a, b);
          if (v === ultimo) {
            corsa++;
          } else {
            if (corsa >= 5) p += 3 + (corsa - 5);
            storia.push(corsa);
            corsa = 1;
            ultimo = v;
          }
        }
        if (corsa >= 5) p += 3 + (corsa - 5);

        // disegno 1:1:3:1:1 con quattro moduli chiari da un lato: è la
        // firma dei mirini, e trovarla in mezzo ai dati confonde il lettore
        var bit = [];
        for (var b = 0; b < taglia; b++) bit.push(leggi(a, b) ? 1 : 0);
        for (var b = 0; b + 10 < taglia; b++) {
          var f = bit.slice(b, b + 11).join('');
          if (f === '10111010000' || f === '00001011101') p += 40;
        }
      }
    }
    fila(function (y, x) { return m[y][x]; });
    fila(function (x, y) { return m[y][x]; });

    for (var y = 0; y < taglia - 1; y++) {
      for (var x = 0; x < taglia - 1; x++) {
        var v = m[y][x];
        if (v === m[y][x + 1] && v === m[y + 1][x] && v === m[y + 1][x + 1]) p += 3;
      }
    }

    // Sbilanciamento fra chiaro e scuro: dieci punti per ogni 5% di
    // scostamento dalla metà esatta.
    var totale = taglia * taglia;
    p += Math.abs(Math.ceil((scuri * 100 / totale) / 5) - 10) * 10;
    return p;
  }

  /**
   * Restituisce la matrice di puntini del QR: matrice[riga][colonna],
   * true = scuro. Solleva se il testo non ci sta.
   */
  function crea(testo) {
    for (var ver = 1; ver <= 10; ver++) {
      var bit = bitDaTesto(String(testo), ver);
      if (!bit) continue;
      var byte = intreccia(bit, ver);
      var migliore = null, minimo = Infinity;
      for (var mask = 0; mask < 8; mask++) {
        var m = disegna(byte, ver, mask);
        var p = punteggio(m);
        if (p < minimo) { minimo = p; migliore = m; }
      }
      return migliore;
    }
    throw new Error('Testo troppo lungo per un codice QR');
  }

  return { crea: crea };
})();

/* ═════ LO SCHERMO ═══════════════════════════════════════════════════
   Questa pagina non sa niente di vendite, di prezzi e di scontrini. Sa
   fare una domanda sola — "che cosa devo mostrare adesso?" — e disegnare
   la risposta. Tutto quello che decide sta nel motore.

   MOTORE è lo stesso indirizzo del gestionale: la stessa web app di Apps
   Script. Qui però non si entra con Google, perché davanti a questo
   monitor non c'è nessuno che possa accedere: al suo posto c'è il
   gettone nell'indirizzo, che il motore riconosce.
   ═══════════════════════════════════════════════════════════════════ */
/* Il colore dei puntini. Nero: il QR sta gia' dentro un quadrato bianco su
   una locandina rossa, quindi il rosso ce l'ha attorno. I puntini invece
   conviene tenerli il piu' scuri possibile — un lettore li distingue per
   differenza di luce, e ogni sfumatura tolta al nero e' margine tolto alla
   fotocamera. */
var COLORE_QR = '#000000';

/* L'indirizzo del motore.
   Se si chiude questo schermo a un solo account Google (proprieta'
   SATISPAY_EMAIL_SCHERMO), qui va l'indirizzo di una distribuzione a parte,
   quella con «Esegui come: utente che accede» — perche' solo cosi' Google
   ci dice CHI sta guardando. Il tablet del banco resta sulla sua, che non
   chiede nessun accesso: se si sbaglia qui, si ferma lo schermo del
   cliente e non l'incasso. */
var MOTORE = 'https://script.google.com/macros/s/AKfycbxEc6tE0gARPbH9qUOyJOP0SgePOlTU38Fqxklujy2AYipeK1963F5KCV4oaUUQK-7e/exec';

(function () {
  'use strict';

  var ATTESA_NORMALE = 2000;    // ogni quanto si chiede al motore
  var ATTESA_RIPOSO  = 5000;    // quando da un po' non succede niente
  var ATTESA_GUASTO  = 5000;    // se il motore non risponde, si rallenta

  /* Perche' due ritmi.
     Questo schermo chiede al motore anche quando al banco non sta
     succedendo niente, e in otto ore di mercato sono decine di megabyte
     sulla saponetta — piu' il logorio, che su un iPad vecchio conta di
     piu': ogni domanda costruisce e smonta un elemento nella pagina, ed e'
     quel ritmo che a lungo andare stanca Safari.
     Rallentare sempre pero' vorrebbe dire far aspettare il cliente fino a
     cinque secondi prima di vedere il QR, e cinque secondi con la coda
     dietro sono lunghi. Quindi: pieno ritmo mentre si lavora e per un
     minuto buono dopo, poi si rallenta da soli. Al mercato non si rallenta
     mai davvero; la notte e nelle ore vuote sempre.                    */
  var CODA_VELOCE_MS = 60 * 1000;
  var ultimoMovimento = new Date().getTime();

  /* Quante domande di fila devono cadere nel vuoto prima di scriverlo a
     schermo. Una o due cadono di continuo — la saponetta, il tunnel, il
     motore che ci mette un attimo — e non vuol dire niente. Sei di fila
     con questo ritmo sono una ventina di secondi: li' e' rotto davvero, e
     sapere che e' rotto vale piu' di una schermata pulita che mente.
     La causa piu' probabile, se lo schermo e' riservato a un account, e'
     proprio quella: l'iPad e' uscito da Google e la domanda non arriva
     nemmeno al nostro codice, quindi non c'e' nessun errore da leggere —
     solo silenzio. Per questo il consiglio e' scritto qui e non li'. */
  var GUASTI_PRIMA_DI_DIRLO = 6;
  var fallimentiDiFila = 0;
  var GRAZIE_MS      = 30000;   // quanto resta la spunta verde se al banco si distraggono

  /* Ogni tanto la pagina si ricarica da sola.
     Non e' un vezzo: questo schermo resta acceso otto ore su un apparecchio
     con poca memoria, e una pagina che gira per ore accumula — l'animazione
     di sfondo, gli script delle domande al motore, quello che il browser
     tiene da parte. Safari, quando la memoria finisce, uccide la scheda e
     la ricarica per conto suo, con la scritta «si e' verificato un
     problema» ben visibile davanti al cliente.
     Meglio farlo noi, prima di lui, e SOLO da fermi: mai mentre c'e' un QR
     a schermo o la spunta di un pagamento appena ricevuto. Cosi' non si
     vede e non capita mai nel momento sbagliato. */
  var RICARICA_DOPO_MS = 20 * 60 * 1000;
  var accesaDa = new Date().getTime();

  // Il gettone dall'indirizzo, letto a mano: URLSearchParams esiste solo
  // dai Safari recenti, e per prendere un valore solo non vale la pena
  // dipendere da qualcosa che su un iPad vecchio potrebbe non esserci.
  var gettone = '';
  try {
    var pezzi = String(location.search || '').replace(/^\?/, '').split('&');
    for (var i = 0; i < pezzi.length; i++) {
      var eq = pezzi[i].indexOf('=');
      if (eq > 0 && pezzi[i].slice(0, eq) === 't') {
        gettone = decodeURIComponent(pezzi[i].slice(eq + 1));
        break;
      }
    }
  } catch (e) {}

  var schermate = {
    attesa: document.getElementById('attesa'),
    qr:     document.getElementById('qr'),
    pagato: document.getElementById('pagato'),
    guasto: document.getElementById('guasto')
  };
  var pallino    = document.getElementById('collegamento');
  var tela       = document.getElementById('tela');

  var visibile        = 'attesa';
  var codiceDisegnato = '';
  var timerGrazie     = null;
  // Il pagamento la cui spunta verde e' gia' stata mostrata e tolta. Serve
  // a non rimetterla: vedi il commento piu' sotto.
  var pagamentoChiuso = -1;

  function mostra(nome) {
    if (visibile === nome) return;
    if (schermate[visibile]) schermate[visibile].classList.remove('visibile');
    schermate[nome].classList.add('visibile');
    visibile = nome;
  }

  function euro(n) {
    return '€' + Number(n || 0).toFixed(2).replace('.', ',');
  }

  function guasto(titolo, nota) {
    document.getElementById('guastoTitolo').textContent = titolo;
    document.getElementById('guastoNota').textContent = nota || '';
    mostra('guasto');
  }

  /* ─── il disegno del QR ────────────────────────────────────────────
     Si ridisegna solo quando il codice cambia davvero. Ridisegnarlo a
     ogni giro sarebbe inutile e farebbe sfarfallare la tela proprio
     mentre il cliente ci punta sopra il telefono.                     */
  function disegnaQr(codice) {
    if (codice === codiceDisegnato) return true;

    var m;
    try {
      m = QR.crea(codice);
    } catch (e) {
      guasto('Codice non leggibile', 'Il codice ricevuto da Satispay non si può disegnare. Annulla e riprova dal banco.');
      return false;
    }

    var n = m.length;
    var margine = 4;                       // il bordo chiaro che lo standard vuole attorno
    var lato = 8;                          // puntini grandi 8 pixel: la tela poi si scala da sola
    var pixel = (n + margine * 2) * lato;

    tela.width = pixel;
    tela.height = pixel;

    var c = tela.getContext('2d');
    c.fillStyle = '#ffffff';
    c.fillRect(0, 0, pixel, pixel);
    c.fillStyle = COLORE_QR;
    for (var y = 0; y < n; y++) {
      for (var x = 0; x < n; x++) {
        if (m[y][x]) c.fillRect((x + margine) * lato, (y + margine) * lato, lato, lato);
      }
    }
    codiceDisegnato = codice;
    return true;
  }

  /* ─── la domanda al motore ─────────────────────────────────────────
     Non si telefona: ci si fa mandare la risposta come se fosse uno script
     da eseguire. Sembra un giro strano, ed e' il piu' robusto che ci sia.

     Il motivo e' l'apparecchio che sta dall'altra parte. Apps Script
     risponde a ogni chiamata con un rimbalzo verso un altro indirizzo di
     Google, e i browser di dieci anni fa si rifiutano di seguirlo quando la
     richiesta parte da un sito diverso: la chiamata non parte proprio, e la
     pagina resta ferma senza dire niente. Su un iPad con iOS 9 — che e'
     esattamente il tipo di apparecchio che si mette a fare da secondo
     schermo, perche' tanto deve fare una cosa sola — succede questo.

     Uno script caricato in questo modo i rimbalzi li segue senza discutere,
     non ha nessun controllo di origine da soddisfare, e funziona su
     qualunque browser dal 2009 in poi. Cosi' la pagina non ha un modo per
     gli apparecchi nuovi e uno per quelli vecchi: ne ha uno solo, e regge
     dappertutto.                                                          */
  var quanteDomande = 0;

  function chiedi(quandoRisponde, quandoFallisce) {
    quanteDomande++;
    var nome = '__schermoCaraMelle' + quanteDomande;
    var tag = document.createElement('script');
    var chiuso = false;
    var scadenza = null;

    /* Si smonta tutto, non solo si toglie di mezzo il tag: una domanda ogni
       due secondi per otto ore fa quattordicimila script, e quello che
       resta attaccato a ognuno non lo si riprende piu'. Su un apparecchio
       con poca memoria e' la differenza fra arrivare a sera e no. */
    function chiudi() {
      if (scadenza) { clearTimeout(scadenza); scadenza = null; }
      try { window[nome] = undefined; } catch (e) {}
      try { delete window[nome]; } catch (e) {}
      tag.onerror = null;
      tag.onload = null;
      try { tag.src = ''; } catch (e) {}
      if (tag.parentNode) tag.parentNode.removeChild(tag);
    }

    window[nome] = function (dati) {
      if (chiuso) return;
      chiuso = true;
      chiudi();
      quandoRisponde(dati);
    };

    tag.onerror = function () {
      if (chiuso) return;
      chiuso = true;
      chiudi();
      quandoFallisce();
    };

    // Se la risposta non arriva si smette di aspettarla: senza questo, una
    // rete che inghiotte le richieste lascerebbe la pagina appesa per
    // sempre, e nemmeno il pallino si accenderebbe.
    scadenza = setTimeout(function () {
      if (chiuso) return;
      chiuso = true;
      chiudi();
      quandoFallisce();
    }, 15000);

    // Il numero in fondo cambia a ogni giro: senza, un browser affezionato
    // alle sue copie risponderebbe sempre con la prima.
    tag.src = MOTORE + '?azione=satispaySchermo' +
              '&token=' + encodeURIComponent(gettone) +
              '&cb=' + nome +
              '&_=' + new Date().getTime();
    (document.head || document.documentElement).appendChild(tag);
  }

  function applica(d) {
    if (!d || !d.success || !d.risultato) throw new Error('risposta senza esito');
    var s = d.risultato;
    if (!s.success) { guasto('Schermo non riconosciuto', s.errore || ''); return; }

    // C'e' qualcosa a schermo: si sta lavorando, e il minuto di grazia
    // riparte da adesso. Il rallentamento arriva solo dopo un minuto pieno
    // di niente.
    if (s.stato === 'qr' || s.stato === 'pagato') ultimoMovimento = new Date().getTime();

    if (s.stato === 'qr' && s.codice) {
      if (timerGrazie) { clearTimeout(timerGrazie); timerGrazie = null; }
      // Se il codice non si riesce a disegnare la schermata di guasto è già
      // a video: non la si copre con un QR che non c'è.
      if (!disegnaQr(s.codice)) return;
      mostra('qr');
      return;
    }

    if (s.stato === 'pagato') {
      // Questa spunta l'abbiamo gia' mostrata e gia' tolta: non si rimette.
      //
      // Serve perche' lo stato sul motore resta "pagato" finche' al banco
      // non si registra la vendita, e senza questo controllo succedeva
      // questo: spunta verde per mezzo minuto, ritorno al marchio, e alla
      // domanda successiva — due secondi dopo — il motore diceva ancora
      // "pagato" e la spunta tornava. Uno schermo che lampeggia fra il
      // marchio e il verde davanti al cliente seguente.
      //
      // Il numero di revisione cambia a ogni pagamento nuovo, quindi il
      // prossimo cliente la sua spunta la vede regolarmente.
      if (s.revisione === pagamentoChiuso) {
        mostra('attesa');
        return;
      }

      document.getElementById('pagatoImporto').textContent = euro(s.importo);
      mostra('pagato');

      // Se al banco si dimenticano di registrare la vendita, la spunta
      // verde non deve restare accesa per mezz'ora davanti al cliente
      // successivo: dopo mezzo minuto si torna da soli in attesa.
      if (!timerGrazie) {
        var quale = s.revisione;
        timerGrazie = setTimeout(function () {
          timerGrazie = null;
          pagamentoChiuso = quale;
          if (visibile === 'pagato') mostra('attesa');
        }, GRAZIE_MS);
      }
      return;
    }

    // attesa, annullato, scaduto: per il cliente sono la stessa cosa.
    if (timerGrazie) { clearTimeout(timerGrazie); timerGrazie = null; }
    codiceDisegnato = '';
    mostra('attesa');

    // Siamo fermi: e' il momento buono per rinfrescare la memoria.
    if (new Date().getTime() - accesaDa > RICARICA_DOPO_MS) {
      location.reload();
    }
  }

  /* Fermi da abbastanza tempo da poter rallentare? */
  function ritmo() {
    return (new Date().getTime() - ultimoMovimento > CODA_VELOCE_MS)
      ? ATTESA_RIPOSO : ATTESA_NORMALE;
  }
  function giro() {
    chiedi(function (d) {
      // Primo scambio riuscito: da qui in poi il pallino resta spento
      // finché il motore risponde.
      pallino.classList.remove('acceso');
      // Se la risposta e' malformata si accende il pallino e si riprova:
      // l'importante e' che il giro non si fermi MAI. Uno schermo che smette
      // di chiedere resta bello e muto, ed e' il guasto peggiore perche' non
      // sembra un guasto.
      fallimentiDiFila = 0;
      try { applica(d); }
      catch (e) { pallino.classList.add('acceso'); }
      setTimeout(giro, ritmo());
    }, function () {
      // Il motore non risponde. NON si cambia quello che c'e' a schermo:
      // se il cliente sta inquadrando un QR valido, toglierglielo perche'
      // e' caduta la linea per due secondi sarebbe il danno peggiore.
      pallino.classList.add('acceso');
      fallimentiDiFila++;
      // Solo sulla schermata d'attesa, dove non si copre niente di utile.
      if (fallimentiDiFila >= GUASTI_PRIMA_DI_DIRLO && visibile === 'attesa') {
        guasto('Schermo scollegato',
               'Non riesco a parlare col gestionale. Controlla la rete e, se ' +
               'questo apparecchio e\' uscito da Google, rientra con l\'account ' +
               'di CaraMelle: poi ricarica la pagina.');
      }
      setTimeout(giro, ATTESA_GUASTO);
    });
  }

  /* ─── lo schermo non si deve spegnere ──────────────────────────────
     Un tablet lasciato fermo si addormenta, e il cliente si troverebbe
     davanti un vetro nero proprio mentre tira fuori il telefono. Dove il
     browser lo permette si chiede di restare svegli; dove non lo
     permette non succede niente di male.                              */
  function restaSveglio() {
    if (!navigator.wakeLock) return;
    navigator.wakeLock.request('screen').catch(function () {});
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) restaSveglio();
  });

  if (!gettone) {
    guasto('Manca il gettone di questo schermo',
           'Apri l\'indirizzo completo, quello con ?t=… in fondo. Lo stampa la funzione satispayTokenSchermo() nell\'editor di Apps Script.');
  } else {
    restaSveglio();
    giro();
  }
})();
</script>
